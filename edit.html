<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>पदाधिकारी Edit</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap" style="max-width:900px;padding:40px 0"><div class="card"><h1>⚙️ पदाधिकारी Details Edit करें</h1><p>नाम और पद बदलें। अध्यक्ष की फोटो अभी वेबसाइट में लगी हुई है।</p><form><div id="fields"></div><button class="btn" type="button" onclick="save()">💾 Save Details</button><a class="btn" href="index.html">View Website</a></form><p id="msg"></p></div></div><script>
const people=[['p1','अध्यक्ष','श्री BABU LAL BANSHAL'],['p2','महासचिव','श्री SHIV KUMAR YADAV'],['p3','कोषाध्यक्ष','श्री MANISH GOIL'],['p4','उपाध्यक्ष','श्री BIJENDRA YADAV'],['p5','संगठन मंत्री','श्री RAMVEER YADAV'],['p6','मंत्री',''],['p7','मीडिया प्रभारी','श्री UMESH SINGH'],['p8','सचिव','श्री JAHID SAIFI']];
const saved=JSON.parse(localStorage.getItem('people')||'null')||people;
fields.innerHTML=saved.map(x=>'<label>'+x[1]+'<input id="'+x[0]+'" value="'+x[2].replaceAll('"','&quot;')+'"></label>').join('');
function save(){const data=saved.map(x=>[x[0],x[1],document.getElementById(x[0]).value]);localStorage.setItem('people',JSON.stringify(data));msg.textContent='✅ जानकारी सेव हो गई।'}
</script></body></html>
