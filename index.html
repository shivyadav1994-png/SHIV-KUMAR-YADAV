<form id="membershipForm">
  <input type="text" name="name" required placeholder="पूरा नाम">
  
  <input type="tel" name="mobile" required placeholder="मोबाइल नंबर">
  
  <input type="text" name="business" placeholder="व्यवसाय / दुकान">
  
  <input type="text" name="address" placeholder="पता">

  <button type="submit" class="btn">आवेदन भेजें</button>
</form>

<script>
document.getElementById("membershipForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const form = this;
  const data = {
    name: form.name.value,
    mobile: form.mobile.value,
    business: form.business.value,
    address: form.address.value
  };

  fetch("https://script.google.com/macros/s/AKfycbzVkpt-0DfJbC35OcvNw5_ZwFH90rg5eLx0khn4W2bRYwkFy2vNOj6Zib5u920-9H5A/exec", {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(data)
  });

  alert("आवेदन भेज दिया गया। धन्यवाद!");
  form.reset();
});
</script>
